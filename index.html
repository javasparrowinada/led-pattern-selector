<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDパターン選択</title>
<style>
:root{
  --bg:#0a0c10;
  --panel:#13171f;
  --panel2:#1a1f29;
  --line:#272d3a;
  --line2:#3a4255;
  --txt:#e6ebf2;
  --txt2:#9aa6b8;
  --txt3:#5e687a;
  --accent:#4da3ff;
  --accent-d:#1d3a5c;
  --c-aka:#ff2a2a;
  --c-ao:#1456ff;
  --c-daidai:#ff8a14;
  --c-momo:#ff74ad;
  --c-shiro:#ffffff;
  --c-mint:#4ff0c4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(1000px 500px at 50% -10%,#141e2c 0%,transparent 60%),var(--bg);
  color:var(--txt);min-height:100vh;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1000px;margin:0 auto;padding:22px 20px 48px}

header{text-align:center;margin-bottom:22px}
header h1{font-size:20px;font-weight:700;letter-spacing:.02em}
header h1 span{color:var(--accent)}
header p{color:var(--txt3);font-size:12.5px;margin-top:5px}

/* 2-column layout */
.main{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);
  gap:26px;align-items:start}
.left{}
@media(max-width:800px){
  .main{grid-template-columns:1fr;gap:0}
  .left{margin-bottom:0}
}

/* ===== LED STAGE ===== */
.stage{background:radial-gradient(600px 300px at 50% 40%,#11151d,#06080c);
  border:1px solid var(--line);border-radius:18px;
  padding:30px 24px;text-align:center}
.bar-shell{display:flex;justify-content:center;align-items:center;height:96px}
.led-bar{position:relative;width:100%;max-width:420px;height:46px;border-radius:12px;
  background:#05070a;border:1px solid rgba(255,255,255,.10);overflow:hidden;
  transition:background .35s,box-shadow .35s,opacity .15s}
/* diffuser face glow */
.led-bar::after{content:"";position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.03));
  mix-blend-mode:overlay;pointer-events:none}
.led-bar::before{content:"";position:absolute;inset:0;border-radius:12px;
  box-shadow:inset 0 0 24px rgba(0,0,0,.5);pointer-events:none}
.pat-steady{animation:none}
.pat-slow{animation:breath 3.4s ease-in-out infinite}
.pat-fast{animation:blink .5s steps(1,start) infinite}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:.13}}
@keyframes breath{0%,100%{opacity:.18}50%{opacity:1}}

.readout{margin-top:24px;font-size:13px;color:var(--txt2)}
.readout b{color:var(--txt);font-weight:600}
.readout .arr{color:var(--txt3);margin:0 8px}

/* ===== SELECTORS ===== */
.group{margin-bottom:18px}
.group .lab{font-size:12px;color:var(--txt2);font-weight:700;letter-spacing:.08em;
  margin-bottom:9px;display:flex;align-items:center;gap:8px}
.group .lab::before{content:"";width:5px;height:13px;border-radius:2px;background:var(--accent)}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{flex:1;min-width:84px;background:var(--panel2);border:1.5px solid var(--line);
  border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;
  font-size:14px;color:var(--txt);transition:.13s;font-family:inherit;
  -webkit-tap-highlight-color:transparent;user-select:none}
.opt:hover{border-color:var(--line2)}
.opt.active{border-color:var(--accent);background:var(--accent-d);
  box-shadow:0 0 0 1px var(--accent),0 6px 18px rgba(77,163,255,.15)}
.opt small{display:block;color:var(--txt3);font-size:10.5px;margin-top:3px;font-weight:400}
.opt.active small{color:#bcd6f5}

/* color swatch opts */
.opt.color{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;flex:1}
.opt.color .dot{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2)}
.opt.color .cn{font-size:12px}

/* pattern preview dot */
.opt.pat{display:flex;align-items:center;justify-content:center;gap:8px}
.opt.pat .pdot{width:11px;height:11px;border-radius:50%;background:#7d8aa0;flex:none}
.opt.pat.active .pdot{background:var(--accent)}
.pdot.d-slow{animation:breath 3.4s ease-in-out infinite}
.pdot.d-fast{animation:blink .5s steps(1,start) infinite}

.foot{margin-top:30px;font-size:11px;color:var(--txt3);line-height:1.7;
  border-top:1px solid var(--line);padding-top:16px}

/* save feature */
.saveBtn{width:100%;background:var(--accent);color:#06121f;border:0;border-radius:12px;
  padding:14px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.13s;
  -webkit-tap-highlight-color:transparent}
.saveBtn:hover{filter:brightness(1.08)}
.saveBtn:active{transform:scale(.99)}
.saveBtn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.save-hint{font-size:11px;color:var(--txt3);margin-top:8px;text-align:center}
.save-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.save-item{display:flex;align-items:center;gap:11px;background:var(--panel2);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;transition:.12s}
.save-item:hover{border-color:var(--line2)}
.save-item.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.save-item .ssw{width:30px;height:22px;border-radius:6px;flex:none;border:1px solid rgba(255,255,255,.2)}
.save-item .stxt{flex:1;font-size:13px;color:var(--txt);line-height:1.35}
.save-item .stxt small{display:block;color:var(--txt3);font-size:11px}
.save-item .del{background:transparent;border:1px solid var(--line);color:var(--txt3);
  border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;flex:none}
.save-item .del:hover{color:#ff6b6b;border-color:#5a2a2a}
.save-empty{color:var(--txt3);font-size:12px;text-align:center;padding:16px 0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>LEDパターン選択</h1>
    <p>条件を選ぶと、横棒LEDの見え方が切り替わります（6/5 持ち寄り検証用）</p>
  </header>

  <div class="main">
  <div class="left">
  <!-- LED preview -->
  <div class="stage">
    <div class="bar-shell">
      <div class="led-bar pat-steady" id="bar"></div>
    </div>
    <div class="readout" id="readout"></div>
  </div>

  <!-- セーブ -->
  <div class="group" style="margin-top:18px">
    <div class="lab">セーブ（条件 → パターン）</div>
    <button class="saveBtn" id="saveBtn">現在のパターンを保存</button>
    <div class="save-hint">いまの条件・色・パターンを最大18枠まで保存できます（行クリックでその設定に復元）</div>
    <div class="save-list" id="saveList"></div>
  </div>
  </div>

  <div class="right">
  <!-- セレクタ群はすべて config から自動生成 -->
  <div class="group">
    <div class="lab">モード</div>
    <div class="opts" id="modeOpts"></div>
  </div>

  <div class="group">
    <div class="lab">ニオイ強度</div>
    <div class="opts" id="smellOpts"></div>
  </div>

  <div class="group">
    <div class="lab">点灯パターン</div>
    <div class="opts" id="patOpts"></div>
  </div>

  <div class="group">
    <div class="lab">LED色</div>
    <div class="opts" id="colorOpts"></div>
  </div>
  </div>
  </div>

  </div>

<script>
"use strict";

/* =====================================================================
 * 単一ソース（config）— UIはすべてこの定義から生成する。
 * 色・パターン・条件を増減する場合はここだけ直せば全UIに反映される。
 * 仕様の正本: LEDパターン仕様_実装ハンドオフ_v1.yaml（2〜5章）
 * ===================================================================== */
const COLORS = {
  aka:    { name:"赤",       hex:"#ff2a2a" },
  ao:     { name:"青",       hex:"#1456ff" },
  daidai: { name:"オレンジ", hex:"#ff8a14" },
  momo:   { name:"桃色",     hex:"#ff74ad" },
  shiro:  { name:"白",       hex:"#ffffff" },
  mint:   { name:"ミント",   hex:"#4ff0c4" }, // 添付カメラLED由来
};

const PATTERNS = {
  slow:   { name:"ゆっくり点滅", css:"pat-slow",   dot:"d-slow" }, // 呼吸フェード 3.4s
  steady: { name:"点灯",         css:"pat-steady", dot:""       }, // 常時点灯
  fast:   { name:"激しく点滅",   css:"pat-fast",   dot:"d-fast" }, // 2Hz 矩形
};

const MODES = {
  standby:{ name:"待機中", sub:"平常時・空気きれい" },
  cook:   { name:"調理中", sub:"火ON・調理換気"     },
  after:  { name:"調理後", sub:"火OFF・空間換気"    },
};

const SMELL = {
  strong:{ name:"ニオイ強" },
  mid:   { name:"ニオイ中" },
  weak:  { name:"ニオイ弱" },
};

// 一覧の並び順 兼 セレクタの表示順
const ORDER = {
  mode:    ["standby","cook","after"],
  smell:   ["strong","mid","weak"],
  pattern: ["slow","steady","fast"],
  color:   ["aka","ao","daidai","momo","shiro","mint"],
};

const LSKEY = "led_presets_v1";
const MAX_SAVES = 18;

/* =====================================================================
 * 状態
 * ===================================================================== */
const S = { mode:"cook", smell:"strong", pattern:"steady", color:"aka" };
let saves = [];                 // プリセット配列 {mode, smell, color, pattern}（最大5件）

const bar     = document.getElementById("bar");
const readout = document.getElementById("readout");

/* =====================================================================
 * セレクタUIの自動生成（config駆動）
 * ===================================================================== */
function makeOpt(value, cls, inner){
  const b = document.createElement("button");
  b.className = cls;
  b.dataset.v = value;
  b.innerHTML = inner;
  return b;
}

function buildSelectors(){
  const modeBox  = document.getElementById("modeOpts");
  const smellBox = document.getElementById("smellOpts");
  const patBox   = document.getElementById("patOpts");
  const colorBox = document.getElementById("colorOpts");

  ORDER.mode.forEach(k=>
    modeBox.appendChild(makeOpt(k, "opt",
      `${MODES[k].name}<small>${MODES[k].sub}</small>`)));

  ORDER.smell.forEach(k=>
    smellBox.appendChild(makeOpt(k, "opt", SMELL[k].name)));

  ORDER.pattern.forEach(k=>{
    const dotCls = PATTERNS[k].dot ? `pdot ${PATTERNS[k].dot}` : "pdot";
    patBox.appendChild(makeOpt(k, "opt pat",
      `<span class="${dotCls}"></span>${PATTERNS[k].name}`));
  });

  ORDER.color.forEach(k=>
    colorBox.appendChild(makeOpt(k, "opt color",
      `<span class="dot" style="background:${COLORS[k].hex}"></span><span class="cn">${COLORS[k].name}</span>`)));
}

/* =====================================================================
 * 描画
 * ===================================================================== */
function glow(hex){
  bar.style.background = hex;
  bar.style.boxShadow  = `0 0 18px ${hex}, 0 0 40px ${hex}aa, 0 0 80px ${hex}55`;
}

function render(){
  glow(COLORS[S.color].hex);
  bar.className = "led-bar " + PATTERNS[S.pattern].css;
  readout.innerHTML =
    `<b>${MODES[S.mode].name}</b> ・ <b>${SMELL[S.smell].name}</b>` +
    `<span class="arr">→</span>` +
    `<b style="color:${COLORS[S.color].hex}">${COLORS[S.color].name}</b> ・ <b>${PATTERNS[S.pattern].name}</b>`;
}

function setActiveVal(wrapId, val){
  document.querySelectorAll('#'+wrapId+' .opt')
    .forEach(b=>b.classList.toggle('active', b.dataset.v===val));
}

function bind(wrapId, key){
  document.getElementById(wrapId).querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      setActiveVal(wrapId, b.dataset.v);
      S[key] = b.dataset.v;
      render();
      renderSaves();   // 現在設定に一致する保存行のハイライトを更新
    };
  });
}

/* =====================================================================
 * セーブ機能
 * ===================================================================== */
function loadSaves(){
  try{
    const r = localStorage.getItem(LSKEY);
    const parsed = r ? JSON.parse(r) : [];
    saves = Array.isArray(parsed) ? parsed.slice(0, MAX_SAVES) : [];
  }catch(e){ saves = []; }
}
function persist(){ try{ localStorage.setItem(LSKEY, JSON.stringify(saves)); }catch(e){} }

// 保存行が「いまの設定」と一致するか（ハイライト用）
const isCurrent = v =>
  v.mode===S.mode && v.smell===S.smell && v.color===S.color && v.pattern===S.pattern;

function updateSaveBtn(){
  const btn  = document.getElementById("saveBtn");
  const full = saves.length >= MAX_SAVES;
  btn.disabled    = full;
  btn.textContent = full
    ? `保存は上限です（${MAX_SAVES}件）`
    : `現在のパターンを保存（${saves.length}/${MAX_SAVES}）`;
}

function renderSaves(){
  const list = document.getElementById("saveList");
  if(!saves.length){ list.innerHTML='<div class="save-empty">まだ保存はありません</div>'; return; }

  list.innerHTML="";
  saves.forEach((v,i)=>{
    const el=document.createElement("div");
    el.className="save-item"+(isCurrent(v)?" cur":"");
    el.innerHTML=
      `<span class="ssw" style="background:${COLORS[v.color].hex};box-shadow:0 0 8px ${COLORS[v.color].hex}"></span>
       <span class="stxt"><b>${MODES[v.mode].name} × ${SMELL[v.smell].name}</b><small>${COLORS[v.color].name} ・ ${PATTERNS[v.pattern].name}</small></span>
       <button class="del">削除</button>`;
    el.onclick = ev=>{
      if(ev.target.classList.contains("del")){
        saves.splice(i,1); persist(); renderSaves(); updateSaveBtn(); return;
      }
      // 行クリック = その保存（条件＋見せ方）を丸ごと復元
      S.mode=v.mode; S.smell=v.smell; S.color=v.color; S.pattern=v.pattern;
      setActiveVal("modeOpts",v.mode);  setActiveVal("smellOpts",v.smell);
      setActiveVal("colorOpts",v.color); setActiveVal("patOpts",v.pattern);
      render(); renderSaves();
    };
    list.appendChild(el);
  });
}

document.getElementById("saveBtn").onclick = ()=>{
  if(saves.length >= MAX_SAVES) return;            // 上限ガード
  saves.push({ mode:S.mode, smell:S.smell, color:S.color, pattern:S.pattern });
  persist(); renderSaves(); updateSaveBtn();
};

/* =====================================================================
 * 初期化
 * ===================================================================== */
buildSelectors();
bind("modeOpts","mode");
bind("smellOpts","smell");
bind("patOpts","pattern");
bind("colorOpts","color");

setActiveVal("modeOpts",  S.mode);
setActiveVal("smellOpts", S.smell);
setActiveVal("patOpts",   S.pattern);
setActiveVal("colorOpts", S.color);

loadSaves();
updateSaveBtn();
renderSaves();
render();
</script>
</body>
</html>
